<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#7c3aed">
  <title>רשימת ציוד לבית הספר</title>

  <style>
    :root {
      /* צבעי בסיס */
      --purple: #7c3aed;
      --dark-purple: #5b21b6;
      --pink: #ec4899;
      --blue: #3b82f6;
      --green: #22c55e;
      --yellow: #facc15;
      --orange: #fb923c;
      --red: #ef4444;
      --cyan: #06b6d4;

      /* צבעי רקע וטקסט (Light Mode) */
      --text: #253047;
      --muted: #6b7280;
      --background: #fffaf3;
      --card: #ffffff;
      --card-hover: #f8fafc;
      --border: #e9e3f5;
      --input-bg: #ffffff;
      --shadow: 0 12px 28px rgba(91, 33, 182, 0.08);
      --glass-bg: rgba(255, 255, 255, 0.93);
    }

    /* תמיכה אוטומטית במצב כהה (Dark Mode) */
    @media (prefers-color-scheme: dark) {
      :root {
        --text: #f3f4f6;
        --muted: #9ca3af;
        --background: #0f172a;
        --card: #1e293b;
        --card-hover: #334155;
        --border: #334155;
        --input-bg: #1e293b;
        --shadow: 0 12px 28px rgba(0, 0, 0, 0.3);
        --glass-bg: rgba(30, 41, 59, 0.93);
      }
      
      .grade-heading {
        background: #332a00 !important;
        border-color: #6a5300 !important;
      }
      .grade-heading h2 { color: #fef08a !important; }
      .grade-heading p { color: #fde047 !important; }
      .important-note { color: #e2e8f0 !important; background: rgba(255,255,255,0.1) !important; }
      .progress-card { background: var(--card) !important; border-color: var(--border) !important; }
      .progress-number { background: #3b2759 !important; color: #ddd6fe !important; }
      .progress-track { background: #334155 !important; border-color: #475569 !important; }
      .encouragement { color: #c4b5fd !important; }
      .checkbox-design { background: var(--input-bg) !important; }
      .checklist-item.completed { background: rgba(34, 197, 94, 0.1) !important; }
      .checklist-item.completed .item-text { color: #6ee7b7 !important; }
      .completion-box { background: linear-gradient(135deg, #064e3b, #065f46) !important; border-color: #059669 !important; color: #a7f3d0 !important; }
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans Hebrew", sans-serif;
      color: var(--text);
      background-color: var(--background);
      background-image: 
        radial-gradient(circle at 10% 5%, rgba(250, 204, 21, 0.15), transparent 25%),
        radial-gradient(circle at 90% 12%, rgba(236, 72, 153, 0.1), transparent 28%),
        radial-gradient(circle at 50% 100%, rgba(59, 130, 246, 0.1), transparent 34%);
      background-attachment: fixed;
    }

    button, input { font-family: inherit; }
    button:focus-visible, input:focus-visible { outline: 4px solid rgba(250, 204, 21, 0.7); outline-offset: 3px; }

    .page { width: min(1080px, calc(100% - 20px)); margin: 0 auto; padding: 18px 0 55px; }

    /* כותרת - Hero */
    .hero {
      position: relative;
      overflow: hidden;
      padding: 30px;
      color: white;
      border-radius: 32px;
      background: linear-gradient(135deg, #7c3aed, #8b5cf6 48%, #ec4899);
      box-shadow: 0 18px 38px rgba(124, 58, 237, 0.23);
    }
    .hero::before {
      content: ""; position: absolute; top: -80px; right: -55px;
      width: 210px; height: 210px; border-radius: 50%; background: rgba(255, 255, 255, 0.13);
    }
    .hero-content { position: relative; z-index: 2; }
    .hero-icon {
      position: absolute; z-index: 1; top: 20px; left: 25px;
      font-size: 92px; opacity: 0.2; transform: rotate(-10deg);
    }
    .year-badge {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 7px 13px; border-radius: 999px; background: rgba(255, 255, 255, 0.2);
      font-size: 14px; font-weight: bold; backdrop-filter: blur(8px);
    }
    h1 { margin: 13px 0 9px; font-size: clamp(32px, 8vw, 54px); line-height: 1.1; text-shadow: 0 4px 0 rgba(91, 33, 182, 0.27); }
    .hero p { max-width: 720px; margin: 0; font-size: 18px; line-height: 1.6; }

    /* לשוניות */
    .tabs {
      position: sticky; z-index: 30; top: 7px; display: grid; gap: 10px; margin: 18px 0; padding: 8px;
      border: 2px solid var(--border); border-radius: 23px; background: var(--glass-bg);
      box-shadow: var(--shadow); backdrop-filter: blur(12px);
    }
    .tab-button {
      min-height: 58px; padding: 10px; color: var(--muted); border: 0; border-radius: 17px;
      background: transparent; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.2s ease;
    }
    .tab-button:hover { background: var(--card-hover); }
    .tab-button.active {
      color: white; background: linear-gradient(135deg, var(--purple), var(--pink));
      box-shadow: 0 8px 20px rgba(124, 58, 237, 0.22); transform: translateY(-1px);
    }

    /* תוכן הכיתות - מוסתר ומוצג באנימציה */
    .grade-panel { display: none; opacity: 0; }
    .grade-panel.active { display: block; animation: fadeIn 0.4s ease forwards; }
    @keyframes fadeIn { to { opacity: 1; } }

    .grade-heading {
      display: flex; align-items: center; gap: 14px; margin-bottom: 16px; padding: 17px 20px;
      border: 3px solid #fde68a; border-radius: 22px; background: #fff8cf;
    }
    .grade-heading-icon { flex: 0 0 auto; font-size: 43px; }
    .grade-heading h2 { margin: 0 0 4px; color: var(--dark-purple); font-size: 25px; }
    .grade-heading p { margin: 0; color: #6b5b20; line-height: 1.5; }

    /* התקדמות */
    .progress-card { padding: 18px; border: 3px solid var(--border); border-radius: 24px; background: var(--card); box-shadow: var(--shadow); }
    .progress-header { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 11px; font-weight: bold; }
    .progress-number { padding: 6px 11px; color: var(--dark-purple); border-radius: 999px; background: #f3e8ff; white-space: nowrap; }
    .progress-track { height: 18px; overflow: hidden; border: 3px solid var(--border); border-radius: 999px; background: var(--card-hover); }
    .progress-fill {
      width: 0%; height: 100%; border-radius: inherit; transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      background: repeating-linear-gradient(-45deg, #facc15, #facc15 12px, #fde047 12px, #fde047 24px);
    }
    .encouragement { margin-top: 12px; color: var(--dark-purple); text-align: center; font-weight: bold; }

    /* כפתורים */
    .toolbar { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin: 18px 0; }
    .action-button {
      min-height: 48px; padding: 12px 18px; border: 0; border-bottom: 4px solid rgba(0, 0, 0, 0.15);
      border-radius: 16px; font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.15s ease;
    }
    .action-button:hover { transform: translateY(-2px); filter: brightness(1.05); }
    .action-button:active { transform: translateY(2px); border-bottom-width: 1px; }
    
    .filter-button { color: white; background: var(--blue); }
    .mark-all-button { color: white; background: var(--green); }
    .reset-button { color: white; background: var(--pink); }
    .print-button { color: #4c3900; background: var(--yellow); }

    /* כרטיסי קטגוריות */
    .categories-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; gap: 18px; }
    .category-card {
      position: relative; overflow: hidden; padding: 18px; border: 2px solid var(--border);
      border-radius: 25px; background: var(--card); box-shadow: var(--shadow); transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .category-card:hover { transform: translateY(-2px); box-shadow: 0 16px 34px rgba(0, 0, 0, 0.08); }
    .category-header { display: flex; align-items: center; gap: 11px; margin-bottom: 7px; }
    .category-icon {
      display: grid; place-items: center; flex: 0 0 auto; width: 51px; height: 51px;
      border-radius: 17px; background: var(--card-hover); font-size: 28px; transform: rotate(-4deg);
    }
    .category-title { margin: 0; font-size: 21px; }
    .category-subtitle { display: block; margin-top: 3px; color: var(--muted); font-size: 13px; }
    .category-progress { margin: 8px 0 16px 0; font-size: 13px; font-weight: bold; opacity: 0.8; }

    /* צבעים דינמיים לקטגוריות מתקבלים דרך משתני JS */
    
    /* פריטי ציוד */
    .category-items { display: flex; flex-direction: column; gap: 8px; }
    .checklist-item {
      position: relative; display: flex; align-items: flex-start; gap: 11px;
      min-height: 50px; padding: 12px; border: 1px solid var(--border); border-radius: 12px;
      line-height: 1.5; cursor: pointer; transition: 0.2s ease; background: var(--card);
    }
    .checklist-item:hover { background: var(--card-hover); transform: translateX(-3px); }
    .checklist-item:active { transform: scale(0.98); }
    .checklist-item input { position: absolute; opacity: 0; pointer-events: none; }
    .checkbox-design {
      display: grid; place-items: center; flex: 0 0 auto; width: 28px; height: 28px; margin-top: 2px;
      color: white; border: 2px solid currentColor; border-radius: 8px; background: var(--input-bg);
      font-size: 16px; transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    .checklist-item input:checked + .checkbox-design {
      transform: scale(1.1) rotate(-5deg);
    }
    .checklist-item input:checked + .checkbox-design::after { content: "✓"; font-weight: bold; }
    
    .item-text { flex: 1; font-size: 16px; font-weight: 600; transition: 0.2s; }
    .checklist-item.completed { background: #f7fff9; border-color: #bbf7d0; }
    .checklist-item.completed .item-text { color: var(--muted); text-decoration: line-through; opacity: 0.7; }
    
    .important-note { margin-top: 15px; padding: 12px; border-radius: 14px; font-size: 14px; font-weight: bold; line-height: 1.55; }

    /* סיום */
    .completion-box {
      display: none; margin-top: 22px; padding: 24px; color: #166534; border: 4px solid #86efac;
      border-radius: 25px; background: linear-gradient(135deg, #dcfce7, #f0fdf4); text-align: center;
      box-shadow: 0 12px 26px rgba(34, 197, 94, 0.16);
    }
    .completion-box.show { display: block; animation: completion-animation 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .completion-box h2 { margin: 0 0 7px; font-size: 28px; }
    .completion-box p { margin: 0; font-size: 17px; }
    @keyframes completion-animation { 0% { opacity: 0; transform: scale(0.8); } 100% { opacity: 1; transform: scale(1); } }

    /* קונפטי */
    .confetti { position: fixed; z-index: 999; top: -25px; width: 13px; height: 18px; border-radius: 4px; pointer-events: none; animation: confetti-fall 2.8s linear forwards; }
    @keyframes confetti-fall { to { transform: translateY(110vh) rotate(720deg); opacity: 0; } }

    footer { margin-top: 25px; color: var(--muted); text-align: center; font-size: 14px; line-height: 1.6; }

    /* טלפון */
    @media (max-width: 768px) {
      .page { width: 100%; padding: 10px 14px 40px; }
      .hero { padding: 24px 17px; border-radius: 25px; }
      .hero-icon { top: 12px; left: 3px; font-size: 68px; }
      .categories-grid { grid-template-columns: 1fr; }
      .toolbar { grid-template-columns: 1fr 1fr; }
      .print-button, .filter-button { grid-column: 1 / -1; }
      .progress-header { flex-direction: column; align-items: flex-start; }
    }

    /* הדפסה */
    @media print {
      body { background: white; color: black; }
      .tabs, .toolbar, .encouragement, footer, .completion-box, .progress-card { display: none !important; }
      .page { width: 100%; padding: 0; margin: 0; }
      .hero { color: black; border: 2px solid black; background: white; box-shadow: none; padding: 15px; }
      .hero-icon { display: none; }
      .categories-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
      .category-card { break-inside: avoid; padding: 10px; border: 1px solid #ccc; box-shadow: none; background: white; }
      .checklist-item { border: none; padding: 4px 0; min-height: auto; background: transparent !important; }
      .checkbox-design { width: 20px; height: 20px; border-color: #000; border-radius: 4px; background: white !important; }
      .checklist-item.completed .item-text { text-decoration: none; color: black !important; opacity: 1; }
      .checklist-item input:checked + .checkbox-design::after { color: black; }
    }
  </style>
</head>
<body>

  <main class="page">
    <header class="hero">
      <div class="hero-icon">🎒</div>
      <div class="hero-content">
        <div class="year-badge">🌟 שנת הלימודים תשפ״ז</div>
        <h1>מתכוננים לבית הספר!</h1>
        <p>בוחרים את הכיתה, מסמנים את הציוד שכבר קנינו ואוספים כוכבים בדרך ליום הראשון בבית הספר.</p>
      </div>
    </header>

    <!-- הניווט ייווצר אוטומטית דרך JS -->
    <nav class="tabs" aria-label="בחירת כיתה" id="tabs-container"></nav>

    <!-- התוכן של הכיתות ייווצר אוטומטית אל תוך הדיב הזה -->
    <div id="grades-container"></div>

    <footer>
      ⭐ כל כיתה נשמרת בנפרד. הסימונים נשמרים אוטומטית במכשיר.
    </footer>
  </main>

  <script>
    // Data Structure - DRY Approach
    const gradesData = {
      grade1: {
        id: 'grade1',
        tabTitle: '🧒 כיתה א׳',
        title: 'רשימת ציוד לעולים לכיתה א׳',
        subtitle: 'שנת הלימודים תשפ״ז — מתחילים את בית הספר מוכנים ובחיוך.',
        icon: '🌈',
        storageKey: "grade-one-list-5787",
        categories: [
          {
            title: "כלי כתיבה", subtitle: "כל מה שצריך לקלמר", icon: "✏️", color: "var(--purple)",
            items: ["2 מחקים גדולים", "מחדד עם מיכל", "מספריים", "4 דבק סטיק", "סרגל קטן באורך 15 ס״מ", "קלמר גדול עם 2 תאים", "12 עפרונות איכותיים", "סט טושים דקים", "סט גירי שעווה", "סט 4 מדגישים"]
          },
          {
            title: "לוח מחיק", subtitle: "כותבים, מוחקים ומנסים שוב", icon: "🧽", color: "var(--cyan)",
            items: ["לוח מחיק בגודל A4", "2 טושים מחיקים ללוח", "מחק ללוח"]
          },
          {
            title: "מחברות", subtitle: "מחברות מותאמות לכיתה א׳", icon: "📒", color: "var(--blue)",
            items: ["5 מחברות ״חכמה״ 10 שורות", "מחברת חשבון ״חכמה״ 1", "2 מחברות חלקות", "מדבקות למחברות"]
          },
          {
            title: "עטיפות למחברות", subtitle: "קונים עטיפות בצבעים", icon: "🌈", color: "var(--pink)",
            items: ["עטיפה ירוקה", "עטיפה אדומה", "עטיפה כחולה", "עטיפה לבנה", "עטיפה צהובה", "עטיפה שקופה"]
          },
          {
            title: "תיקיות ואחסון", subtitle: "שומרים שהכול מסודר", icon: "📁", color: "var(--orange)",
            items: ["5 תיקי הגשה עם חזית שקופה", "תיק פלסטיק פוליו עם גומייה", "תיק טבעות אחד בגודל A4"]
          }
        ]
      },
      grade3: {
        id: 'grade3',
        tabTitle: '🎓 כיתה ג׳',
        title: 'רשימת ציוד לעולים לכיתה ג׳',
        subtitle: 'מסמנים כל פריט ומתקדמים יחד עד שהכול מוכן.',
        icon: '📚',
        storageKey: "grade-three-list-5787",
        categories: [
          {
            title: "כלי כתיבה", subtitle: "כל מה שצריך לקלמר", icon: "✏️", color: "var(--purple)",
            items: ["חבילת 12 עפרונות", "3 מחקים", "מחדד עם מיכל", "קלמר", "מדבקות שם"]
          },
          {
            title: "סרגלים וחשבון", subtitle: "מודדים ומחשבים", icon: "📐", color: "var(--blue)",
            items: ["סרגל 15 ס״מ", "סרגל 30 ס״מ", "סט משולשים", "2 מחברות חשבון A4"]
          },
          {
            title: "ציור וצבעים", subtitle: "מוסיפים צבע לכל משימה", icon: "🎨", color: "var(--pink)",
            items: ["סט טושים צבעוניים", "4 מדגשים", "סט עפרונות צבעוניים", "2 מחברות ציור חלקות"]
          },
          {
            title: "יצירה וטכנולוגיה", subtitle: "גוזרים, מדביקים ושומרים קבצים", icon: "✂️", color: "var(--green)",
            items: ["מספריים", "2 דבק סטיק UHU גדול", "דיסק און קי"]
          }
        ]
      }
    };

    // State for filtering
    const state = { hideCompleted: false };

    // --- Render Functions ---
    function renderApp() {
      const tabsContainer = document.getElementById('tabs-container');
      const gradesContainer = document.getElementById('grades-container');
      
      // Setup grid columns based on number of tabs
      tabsContainer.style.gridTemplateColumns = `repeat(${Object.keys(gradesData).length}, 1fr)`;

      Object.values(gradesData).forEach((grade, index) => {
        // Build Tabs
        const btn = document.createElement('button');
        btn.className = `tab-button ${index === 0 ? 'active' : ''}`;
        btn.dataset.target = grade.id;
        btn.textContent = grade.tabTitle;
        btn.onclick = () => activateGrade(grade.id);
        tabsContainer.appendChild(btn);

        // Build Grade Panel
        const section = document.createElement('section');
        section.id = grade.id;
        section.className = `grade-panel ${index === 0 ? 'active' : ''}`;
        
        section.innerHTML = `
          <div class="grade-heading">
            <div class="grade-heading-icon">${grade.icon}</div>
            <div>
              <h2>${grade.title}</h2>
              <p>${grade.subtitle}</p>
            </div>
          </div>

          <div class="progress-card">
            <div class="progress-header">
              <span>התקדמות ציוד:</span>
              <span class="progress-number" data-progress-number>0 מתוך 0</span>
            </div>
            <div class="progress-track">
              <div class="progress-fill" data-progress-fill></div>
            </div>
            <div class="encouragement" data-encouragement>🚀 מוכנים להתחיל? סמנו את הפריט הראשון!</div>
          </div>

          <div class="toolbar">
            <button type="button" class="action-button filter-button" onclick="toggleFilter('${grade.id}')">
              👁️ הצג/הסתר מוכנים
            </button>
            <button type="button" class="action-button mark-all-button" onclick="markAll('${grade.id}')">✅ קנינו הכל</button>
            <button type="button" class="action-button reset-button" onclick="resetList('${grade.id}')">🔄 איפוס</button>
            <button type="button" class="action-button print-button" onclick="window.print()">🖨️ הדפסה</button>
          </div>

          <div class="categories-grid">
            ${grade.categories.map((cat, catIdx) => `
              <article class="category-card" style="--category-color: ${cat.color}; border-color: ${cat.color}40;">
                <div class="category-header">
                  <div class="category-icon" style="color: ${cat.color}; background: ${cat.color}20;">${cat.icon}</div>
                  <div>
                    <h3 class="category-title" style="color: ${cat.color}">${cat.title}</h3>
                    <span class="category-subtitle">${cat.subtitle}</span>
                  </div>
                </div>
                <div class="category-progress" style="color: ${cat.color}"></div>
                <div class="category-items">
                  ${cat.items.map((item, itemIdx) => `
                    <label class="checklist-item" style="--category-color: ${cat.color};">
                      <input type="checkbox" onchange="handleCheck('${grade.id}')" data-id="chk-${catIdx}-${itemIdx}">
                      <span class="checkbox-design"></span>
                      <span class="item-text">${item}</span>
                    </label>
                  `).join('')}
                </div>
                ${cat.note ? `<div class="important-note" style="color: ${cat.color}; background: ${cat.color}15;">💡 ${cat.note}</div>` : ''}
              </article>
            `).join('')}
          </div>

          <div class="completion-box" data-completion>
            <h2>🎉 כל הכבוד! הכול מוכן!</h2>
            <p>הקלמר מלא, המחברות עטופות ואפשר להתחיל את השנה בראש שקט.</p>
          </div>
        `;
        
        gradesContainer.appendChild(section);
        loadState(grade.id);
      });

      // Restore last active tab
      const savedTab = localStorage.getItem("selected-grade-tab");
      if (savedTab && gradesData[savedTab]) activateGrade(savedTab);
    }

    // --- Logic Functions ---
    function activateGrade(gradeId) {
      document.querySelectorAll(".tab-button").forEach(btn => 
        btn.classList.toggle("active", btn.dataset.target === gradeId)
      );
      document.querySelectorAll(".grade-panel").forEach(panel => 
        panel.classList.toggle("active", panel.id === gradeId)
      );
      localStorage.setItem("selected-grade-tab", gradeId);
    }

    function getInputs(gradeId) {
      return Array.from(document.querySelectorAll(`#${gradeId} .checklist-item input`));
    }

    function handleCheck(gradeId) {
      const inputs = getInputs(gradeId);
      inputs.forEach(input => {
        const item = input.closest('.checklist-item');
        item.classList.toggle("completed", input.checked);
        
        // Handle filter visibility
        if (state.hideCompleted && input.checked) {
          item.style.display = 'none';
        } else {
          item.style.display = 'flex';
        }
      });
      
      saveState(gradeId);
      updateProgress(gradeId, true);
    }

    function saveState(gradeId) {
      const data = getInputs(gradeId).map(chk => chk.checked);
      localStorage.setItem(gradesData[gradeId].storageKey, JSON.stringify(data));
    }

    function loadState(gradeId) {
      const saved = JSON.parse(localStorage.getItem(gradesData[gradeId].storageKey) || "[]");
      const inputs = getInputs(gradeId);
      
      inputs.forEach((input, i) => {
        input.checked = !!saved[i];
      });
      
      handleCheck(gradeId); // applies visual classes
      updateProgress(gradeId, false);
    }

    function markAll(gradeId) {
      getInputs(gradeId).forEach(input => input.checked = true);
      handleCheck(gradeId);
    }

    function resetList(gradeId) {
      if (!confirm("לאפס את כל הסימונים בכיתה זו?")) return;
      getInputs(gradeId).forEach(input => input.checked = false);
      handleCheck(gradeId);
    }

    function toggleFilter(gradeId) {
      state.hideCompleted = !state.hideCompleted;
      handleCheck(gradeId); // Re-apply visual states
    }

    function updateProgress(gradeId, allowConfetti) {
      const panel = document.getElementById(gradeId);
      const inputs = getInputs(gradeId);
      const completed = inputs.filter(i => i.checked).length;
      const total = inputs.length;
      const pct = total ? Math.round((completed / total) * 100) : 0;

      // Update Header Progress
      panel.querySelector("[data-progress-number]").textContent = `${completed} מתוך ${total} (${pct}%)`;
      panel.querySelector("[data-progress-fill]").style.width = `${pct}%`;
      
      // Update Texts
      let msg = "🚀 מוכנים להתחיל? סמנו את הפריט הראשון!";
      if (pct === 100) msg = "🎉 המשימה הושלמה!";
      else if (pct >= 75) msg = `🏃 כמעט סיימנו! נשארו רק ${total - completed} פריטים.`;
      else if (pct >= 50) msg = "⭐ חצי דרך מאחורינו!";
      else if (pct > 0) msg = "🌱 התחלה מצוינת!";
      panel.querySelector("[data-encouragement]").textContent = msg;

      // Update Categories Progress
      panel.querySelectorAll(".category-card").forEach(card => {
        const catInputs = Array.from(card.querySelectorAll("input"));
        const catComp = catInputs.filter(i => i.checked).length;
        const txt = card.querySelector(".category-progress");
        txt.textContent = catComp === catInputs.length ? "🌟 הושלם!" : `${catComp}/${catInputs.length} מוכנים`;
      });

      // Completion Box & Confetti
      const compBox = panel.querySelector("[data-completion]");
      const wasComplete = compBox.classList.contains("show");
      const isComplete = (pct === 100);
      
      compBox.classList.toggle("show", isComplete);
      if (isComplete && !wasComplete && allowConfetti) launchConfetti();
    }

    function launchConfetti() {
      const colors = ["#7c3aed", "#ec4899", "#3b82f6", "#22c55e", "#facc15"];
      for (let i = 0; i < 70; i++) {
        const c = document.createElement("div");
        c.className = "confetti";
        c.style.left = `${Math.random() * 100}vw`;
        c.style.background = colors[Math.floor(Math.random() * colors.length)];
        c.style.animationDelay = `${Math.random() * 0.8}s`;
        document.body.appendChild(c);
        setTimeout(() => c.remove(), 3000);
      }
    }

    // Initialize App
    document.addEventListener("DOMContentLoaded", renderApp);
  </script>
</body>
</html>
