<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>מבצע אבי בחופש</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;600;700;800;900&family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ===== 1960s executive-office palette ===== */
  :root{
    --walnut:#4E2C1B;
    --walnut-light:#6B4023;
    --walnut-deep:#33190D;
    --petrol:#0D3D56;
    --petrol-light:#175A7D;
    --petrol-pale:#E3EDF1;
    --cream:#DDC7A1;
    --cream-pale:#F1E7D2;
    --paper:#FAF4E7;
    --paper-2:#F5EDDB;
    --card:#FFFCF6;
    --stone:#B8A38B;
    --stone-soft:rgba(184,163,139,.42);
    --amber:#BF7E30;
    --amber-light:#D89A52;
    --amber-pale:#F3E1C3;
    --moss:#39562E;
    --moss-pale:#E1EADB;
    --ink:#2E1B10;
    --ink-soft:#7C6A53;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    color:var(--ink);
    font-family:'Heebo',sans-serif;
    min-height:100vh;
    background:var(--paper);
    position:relative;
  }
  /* faint ledger-paper grain — felt more than seen */
  body::before{
    content:"";
    position:fixed; inset:0;
    pointer-events:none;
    opacity:.6;
    background-image:
      repeating-linear-gradient(0deg, rgba(184,163,139,.055) 0 1px, transparent 1px 32px),
      repeating-linear-gradient(90deg, rgba(184,163,139,.04) 0 1px, transparent 1px 32px);
  }
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
  :focus-visible{outline:2.5px solid var(--petrol);outline-offset:2px;border-radius:6px;}

  /* ===== Header ===== */
  header{
    color:var(--paper);
    padding:38px 24px 80px;
    position:relative;
    overflow:hidden;
    background:linear-gradient(150deg, var(--petrol) 0%, #0A2E41 55%, var(--walnut-deep) 135%);
  }
  header::after{
    content:"";
    position:absolute;
    left:0; right:0; bottom:0;
    height:3px;
    background:linear-gradient(90deg, transparent, var(--amber) 18%, var(--amber-light) 50%, var(--amber) 82%, transparent);
    opacity:.9;
  }
  .masthead{
    max-width:980px;
    margin:0 auto;
    display:flex;
    align-items:center;
    gap:18px;
    position:relative;
    z-index:2;
  }
  /* the seal — a brass travel-stamp medallion, the one signature flourish */
  .seal{
    flex:0 0 auto;
    width:60px;height:60px;
    border-radius:50%;
    border:1.8px solid rgba(221,199,161,.55);
    display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 35% 30%, rgba(221,199,161,.22), rgba(191,126,48,.1) 70%);
    box-shadow:inset 0 0 0 1px rgba(191,126,48,.25), inset 0 1px 0 rgba(255,255,255,.15), 0 12px 28px rgba(20,10,4,.32);
  }
  .seal svg{width:27px;height:27px;transform:rotate(-18deg);}
  .masthead-text h1{
    font-family:'Frank Ruhl Libre',serif;
    font-weight:800;
    font-size:clamp(24px,4vw,34px);
    margin:0 0 4px;
    letter-spacing:-.2px;
    line-height:1.2;
  }
  .masthead-text p{margin:0;color:#EFE3CB;font-size:15.5px;line-height:1.5;font-weight:500;}
  .masthead-text .tag{
    display:inline-block;
    margin-top:11px;
    font-size:11px;
    font-weight:700;
    letter-spacing:.6px;
    color:var(--walnut);
    border:1px solid rgba(78,44,27,.12);
    background:var(--cream);
    border-radius:999px;
    padding:5px 12px;
  }

  /* parked planes on the tarmac, as seen through the header "window" */
  .tarmac{position:absolute;left:0;right:0;bottom:0;height:70px;z-index:1;overflow:hidden;pointer-events:none;}
  .plane-mini{position:absolute;display:block;}
  .plane-mini svg{display:block;width:100%;height:100%;}
  .plane-mini.p1{left:8%;width:30px;height:30px;bottom:13px;opacity:.42;transform:rotate(91deg);}
  .plane-mini.p2{left:46%;width:22px;height:22px;bottom:19px;opacity:.32;transform:rotate(86deg);}
  .plane-mini.p3{left:80%;width:36px;height:36px;bottom:11px;opacity:.48;transform:rotate(96deg);}

  /* ===== Search ===== */
  .search-zone{
    max-width:980px;
    margin:-36px auto 0;
    padding:0 24px;
    position:sticky;
    top:10px;
    z-index:30;
  }
  .search-card{
    background:var(--card);
    border:1px solid var(--stone-soft);
    border-radius:19px;
    box-shadow:0 22px 46px -26px rgba(46,27,16,.5), 0 4px 14px rgba(46,27,16,.09);
    padding:16px 18px 14px;
  }
  .search-row{display:flex;align-items:center;gap:12px;border-bottom:1px dashed var(--stone-soft);padding-bottom:12px;}
  .search-row svg{flex:0 0 auto;color:var(--petrol);opacity:.85;}
  #search{flex:1;border:none;outline:none;background:transparent;font-family:'Heebo',sans-serif;font-size:17px;font-weight:600;color:var(--ink);min-width:0;}
  #search::placeholder{color:var(--ink-soft);font-weight:500;}
  #search::-webkit-search-cancel-button{display:none;}
  .clear-btn{background:var(--petrol-pale);border:none;cursor:pointer;color:var(--petrol);font-size:13px;font-family:'Heebo',sans-serif;padding:7px 12px;border-radius:999px;display:none;min-height:36px;transition:background .18s ease;}
  .clear-btn.show{display:inline-block;}
  .clear-btn:hover{background:var(--amber-pale);}

  main{max-width:980px;margin:0 auto;padding:22px 24px 70px;position:relative;z-index:2;}
  .result-meta{font-size:12.5px;color:var(--ink-soft);margin:2px 4px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .result-meta b{color:var(--petrol);}
  .reset-all{background:none;border:none;color:var(--petrol);font-size:12.5px;font-weight:700;cursor:pointer;padding:4px 2px;text-decoration:underline;text-underline-offset:2px;transition:color .18s ease;}
  .reset-all:hover{color:var(--walnut);}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px;}

  .group-header{
    grid-column:1/-1;
    display:flex;align-items:center;gap:9px;
    padding:16px 2px 2px;
    font-family:'Frank Ruhl Libre',serif;font-weight:700;font-size:15px;color:var(--walnut);
  }
  .group-header:first-child{padding-top:2px;}
  .group-header .line{flex:1;height:1px;background:linear-gradient(90deg,var(--stone),transparent);}
  .group-header .count{font-family:'Heebo',sans-serif;font-weight:700;font-size:11.5px;color:var(--walnut);background:var(--cream-pale);border-radius:999px;padding:2px 9px;}

  /* ===== Cards — each one a little department letterhead ===== */
  .card{
    background:var(--card);
    border:1px solid var(--stone-soft);
    border-radius:15px;
    position:relative;
    box-shadow:0 14px 26px -20px rgba(46,27,16,.4);
    overflow:hidden;
    animation:rise .3s ease both;
    transition:transform .2s ease, box-shadow .2s ease, border-color .2s ease;
  }
  .card:hover{transform:translateY(-2px);border-color:var(--amber);box-shadow:0 18px 32px -18px rgba(46,27,16,.48);}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  .card::before{
    content:"";
    position:absolute;
    top:0; right:0; left:0;
    height:3px;
    background:var(--walnut);
  }
  .card-head{padding:16px 16px 12px;border-bottom:1px dashed var(--stone-soft);background:linear-gradient(180deg,var(--cream-pale),var(--card) 70%);}
  .office-label{font-size:10.5px;letter-spacing:.6px;color:var(--petrol);text-transform:uppercase;display:block;margin-bottom:3px;font-weight:700;}
  .dept-title{font-family:'Frank Ruhl Libre',serif;font-weight:700;font-size:18.5px;color:var(--walnut);margin:0;line-height:1.3;}
  .dept-title.generic{color:var(--ink-soft);font-weight:500;font-size:14px;font-family:'Heebo',sans-serif;}
  .card-body{padding:13px 16px 16px;display:flex;flex-direction:column;gap:11px;}
  .role-block{display:flex;gap:10px;}
  .role-icon{flex:0 0 auto;width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:var(--petrol-pale);color:var(--petrol);margin-top:1px;}
  .role-icon svg{width:15px;height:15px;}
  .role-icon.collector{background:var(--moss-pale);color:var(--moss);}
  .role-block.is-collector .contact-btn,
  .role-block.is-collector .copy-email-btn{background:var(--moss-pale);border-color:rgba(57,86,46,.4);color:var(--moss);}
  .role-block.is-collector .contact-btn:hover,
  .role-block.is-collector .copy-email-btn:hover{border-color:var(--moss);background:#DCE7D3;}
  .role-block.is-collector .copy-email-btn.is-copied{background:var(--moss);border-color:var(--moss);color:var(--paper);}
  .role-info{flex:1;min-width:0;}
  .role-kind{font-size:11px;color:var(--ink-soft);font-weight:700;margin-bottom:2px;letter-spacing:.3px;}
  .role-name{font-weight:700;font-size:14.5px;color:var(--ink);margin-bottom:4px;}
  .role-contact{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
  .email-row{display:inline-flex;align-items:center;gap:6px;min-width:0;max-width:100%;}

  .contact-btn{
    display:inline-flex;align-items:center;gap:5px;
    font-size:12px;color:var(--petrol);background:var(--paper-2);border:1px solid var(--stone-soft);
    border-radius:9px;padding:6px 9px;cursor:pointer;text-decoration:none;
    max-width:100%;min-width:0;min-height:38px;font-family:'Heebo',sans-serif;
    transition:background .18s ease, border-color .18s ease;
  }
  .contact-btn:hover{border-color:var(--amber);background:var(--amber-pale);}
  .contact-btn:active{background:var(--cream-pale);}
  .contact-btn svg{flex:0 0 auto;width:12px;height:12px;opacity:.75;}
  .contact-btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  /* copy-email button — icon only until copied, then grows to confirm */
  .copy-email-btn{
    flex:0 0 auto;
    display:inline-flex;align-items:center;justify-content:center;gap:5px;
    min-width:38px;min-height:38px;padding:0 10px;
    border-radius:9px;border:1px solid var(--stone-soft);
    background:var(--paper-2);color:var(--petrol);cursor:pointer;
    font-family:'Heebo',sans-serif;
    transition:background .18s ease, border-color .18s ease, color .18s ease, transform .15s ease;
  }
  .copy-email-btn svg{width:14px;height:14px;}
  .copy-email-btn .ci-check,.copy-email-btn .ci-label{display:none;}
  .copy-email-btn:hover{border-color:var(--amber);background:var(--amber-pale);}
  .copy-email-btn:active{transform:scale(.94);}
  .copy-email-btn.is-copied{background:var(--moss-pale);border-color:var(--moss);color:var(--moss);}
  .copy-email-btn.is-copied .ci-copy{display:none;}
  .copy-email-btn.is-copied .ci-check,.copy-email-btn.is-copied .ci-label{display:inline-flex;}
  .copy-email-btn .ci-label{font-size:12px;font-weight:700;white-space:nowrap;}

  .role-empty{font-size:12.5px;color:var(--stone);font-style:italic;}

  .empty-state{text-align:center;padding:60px 20px;color:var(--ink-soft);}
  .empty-state .big{font-family:'Frank Ruhl Libre',serif;font-size:21px;color:var(--walnut);margin-bottom:6px;font-weight:700;}
  .empty-state button{margin-top:14px;background:var(--petrol);color:var(--paper);border:none;border-radius:999px;padding:10px 20px;font-size:13px;font-weight:700;cursor:pointer;font-family:'Heebo',sans-serif;transition:background .18s ease;}
  .empty-state button:hover{background:var(--petrol-light);}
  mark{background:rgba(191,126,48,.32);color:var(--ink);border-radius:3px;padding:0 2px;}
  footer{text-align:center;padding:20px;font-size:12px;color:var(--ink-soft);letter-spacing:.3px;}

  @media (max-width:520px){
    header{padding:28px 16px 66px;}
    .masthead{gap:12px;}
    .seal{width:46px;height:46px;}
    .seal svg{width:21px;height:21px;}
    .masthead-text h1{font-size:clamp(21px,7vw,27px);}
    .masthead-text p{font-size:13px;line-height:1.35;}
    .tarmac{height:52px;}
    .plane-mini.p1{width:22px;height:22px;bottom:10px;}
    .plane-mini.p2{width:17px;height:17px;bottom:14px;}
    .plane-mini.p3{width:26px;height:26px;bottom:8px;}
    .search-zone{margin-top:-30px;padding:0 12px;top:8px;}
    .search-card{padding:13px 14px 12px;border-radius:17px;}
    main{padding-left:12px;padding-right:12px;}
    .grid{grid-template-columns:1fr;}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.001s !important;transition-duration:.001s !important;scroll-behavior:auto !important;}
  }
</style>
</head>
<body>

    <span class="plane-mini p2"><svg viewBox="0 0 64 64" fill="#F1E7D2"><path d="M32 10c1.7 0 3 3.4 3 7.6v9.9l14.6 8.6c.9.5 1.4 1.5 1.4 2.5v2c0 .7-.6 1.1-1.3.9L35 37.4v8.9l4.6 3.5c.5.4.8 1 .8 1.6v1.7c0 .6-.5 1-1.1.8L32 51.4l-7.3 2.5c-.6.2-1.1-.2-1.1-.8v-1.7c0-.6.3-1.2.8-1.6l4.6-3.5v-8.9l-14.7 4.1c-.7.2-1.3-.2-1.3-.9v-2c0-1 .5-2 1.4-2.5L29 27.5v-9.9c0-4.2 1.3-7.6 3-7.6Z"/></svg></span>

  </div>
  <div class="masthead">
    <div class="seal">
      <svg viewBox="0 0 64 64" fill="none">
        <circle cx="32" cy="32" r="26" stroke="#F1E7D2" stroke-width="1.6" opacity=".55"/>
        <circle cx="32" cy="32" r="20" stroke="#BF7E30" stroke-width="1.3" opacity=".75"/>

        <circle cx="32" cy="32" r="2.6" fill="#0D3D56"/>
      </svg>
    </div>
    <div class="masthead-text">
      <h1>מבצע "אבי בחופש"</h1>
      <p>מי מגבה איפה ולמה הוא הסכים לזה?</p>
      <span class="tag">✈ חיפוש לפי מגבה · מתאם · מחלקה · משרד</span>
    </div>
  </div>
</header>

<div class="search-zone">
  <div class="search-card">
    <div class="search-row">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <label for="search" class="sr-only">חיפוש</label>
      <input type="search" id="search" placeholder="חיפוש לפי שם, מחלקה או משרד…" autocomplete="off" enterkeyhint="search">
      <button class="clear-btn" id="clearBtn" type="button">נקה</button>
    </div>
  </div>
</div>

<main>
  <div class="result-meta" id="resultMeta" aria-live="polite"></div>
  <div class="grid" id="grid"></div>
  <div class="empty-state" id="emptyState" style="display:none;">
    <div class="big">לא נמצאו תוצאות</div>
    <div>נסו לחפש שם, מחלקה או משרד אחר</div>
    <button id="resetFromEmpty" type="button">נקה את כל הסינון</button>
  </div>
</main>

<footer>רשימת הגיבויים האישית של אבי כהן לזמן חופשה</footer>

// Group data by office, then keep original order within an office (which follows department order)
const grouped = [...DATA].sort((a,b) => DATA.map(r=>r.office).indexOf(a.office) - DATA.map(r=>r.office).indexOf(b.office));

const grid = document.getElementById('grid');
const searchInput = document.getElementById('search');
const clearBtn = document.getElementById('clearBtn');
const resultMeta = document.getElementById('resultMeta');
const emptyState = document.getElementById('emptyState');
const offices = [...new Set(DATA.map(r => r.office).filter(Boolean))];

function esc(s){
  if(s===null || s===undefined) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function highlight(text, q){
  const t = esc(text);
  if(!q) return t;
  try{
    const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig');
    return t.replace(re, '<mark>$1</mark>');
  }catch(e){ return t; }
}

function matches(rec, q){
  if(!q) return true;
  const fields = [rec.office, rec.department, rec.coordinator_name, rec.approver_name, rec.collector_name,
                   rec.coordinator_email, rec.approver_email, rec.collector_email];
  return fields.some(f => f && String(f).toLowerCase().includes(q));
}

function openGmail(email){
  const url = 'https://mail.google.com/mail/?view=cm&fs=1&to=' + encodeURIComponent(email);
  const w = 640, h = 680;
  const left = Math.max(0, (screen.width - w) / 2);
  const top = Math.max(0, (screen.height - h) / 2);
  window.open(url, 'gmailCompose', `width=${w},height=${h},left=${left},top=${top},noopener,noreferrer`);
}

function openWhatsApp(phone){
  let digits = String(phone).replace(/\D/g, '');
  if(digits.startsWith('0')) digits = '972' + digits.slice(1);
  window.open('https://wa.me/' + digits, '_blank', 'noopener,noreferrer');
}

function contactBtn(kind, value, icon, q){
  if(!value) return '';
  const isEmail = kind === 'email';
  const dataAttr = isEmail ? `data-gmail="${esc(value)}"` : `data-whatsapp="${esc(value)}"`;
  const title = isEmail ? 'פתח מייל ב-Gmail' : 'פתח שיחה ב-WhatsApp';
  return `<button type="button" class="contact-btn" ${dataAttr} title="${title}">${icon}<span>${highlight(value,q)}</span></button>`;
}

function copyEmailBtn(email){
  if(!email) return '';
  return `<button type="button" class="copy-email-btn" data-email="${esc(email)}" aria-label="העתק כתובת אימייל" title="העתק כתובת אימייל">${ICON_COPY}${ICON_CHECK_SM}<span class="ci-label">הועתק</span></button>`;
}

function roleBlock(kind, iconSvg, name, email, phone, isCollector, q){
  if(!name && !email && !phone){
    return `<div class="role-block${isCollector?' is-collector':''}">
      <div class="role-icon${isCollector?' collector':''}">${iconSvg}</div>
      <div class="role-info">
        <div class="role-kind">${kind}</div>
        <div class="role-empty">אין נתון</div>
      </div>
    </div>`;
  }
  return `<div class="role-block${isCollector?' is-collector':''}">
    <div class="role-icon${isCollector?' collector':''}">${iconSvg}</div>
    <div class="role-info">
      <div class="role-kind">${kind}</div>
      <div class="role-name">${highlight(name || '—', q)}</div>
      <div class="role-contact">
        ${email ? `<span class="email-row">${contactBtn('email', email, ICON_MAIL, q)}${copyEmailBtn(email)}</span>` : ''}
        ${contactBtn('phone', phone, ICON_PHONE, q)}
      </div>
    </div>
  </div>`;
}

function cardHTML(rec, q){
  const hasDept = !!rec.department;
  return `<div class="card">
    <div class="card-head">
      <span class="office-label">${highlight(rec.office, q)}</span>
      <h3 class="dept-title${hasDept?'':' generic'}">${hasDept ? highlight(rec.department, q) : 'כללי — ללא חלוקה למחלקות'}</h3>
    </div>
    <div class="card-body">
      ${roleBlock('מתאם.ת', ICON_USER, rec.coordinator_name, rec.coordinator_email, rec.coordinator_phone, false, q)}
      ${roleBlock('מאשר.ת', ICON_CHECK, rec.approver_name, rec.approver_email, rec.approver_phone, false, q)}
      ${roleBlock('מי מגבה אותי', ICON_CLIP, rec.collector_name, rec.collector_email, null, true, q)}
    </div>
  </div>`;
}

function fallbackCopyText(text){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.setAttribute('readonly','');
  ta.style.position = 'fixed';
  ta.style.top = '-1000px';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  try{ document.execCommand('copy'); }catch(err){}
  document.body.removeChild(ta);
}

function markCopied(btn){
  btn.classList.add('is-copied');
  btn.setAttribute('aria-label','הכתובת הועתקה');
  clearTimeout(btn._copyTimer);
  btn._copyTimer = setTimeout(() => {
    btn.classList.remove('is-copied');
    btn.setAttribute('aria-label','העתק כתובת אימייל');
  }, 1700);
}

function copyEmailToClipboard(email, btn){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(email).then(() => markCopied(btn)).catch(() => {
      fallbackCopyText(email);
      markCopied(btn);
    });
  } else {
    fallbackCopyText(email);
    markCopied(btn);
  }
}

function render(){
  const q = searchInput.value.trim().toLowerCase();
  clearBtn.classList.toggle('show', q.length > 0);

  let results = grouped.filter(r => matches(r, q));

  let html = '';
  let lastOffice = null;
  results.forEach(r => {
    if(r.office !== lastOffice){
      const cnt = results.filter(x => x.office === r.office).length;
      html += `<div class="group-header">${esc(r.office)}<span class="line"></span><span class="count">${cnt}</span></div>`;
      lastOffice = r.office;
    }
    html += cardHTML(r, q);
  });
  grid.innerHTML = html;
  emptyState.style.display = results.length === 0 ? 'block' : 'none';

  resultMeta.innerHTML = q
    ? `נמצאו <b>${results.length}</b> תוצאות מתוך ${DATA.length} <button class="reset-all" id="resetAll" type="button">נקה סינון</button>`
    : `סה"כ <b>${DATA.length}</b> רשומות · ${offices.length} משרדים`;

  const resetAllBtn = document.getElementById('resetAll');
  if(resetAllBtn) resetAllBtn.addEventListener('click', resetAll);
}

function resetAll(){
  searchInput.value = '';
  render();
}

searchInput.addEventListener('input', render);
clearBtn.addEventListener('click', () => {
  searchInput.value = '';
  searchInput.focus();
  render();
});
document.getElementById('resetFromEmpty').addEventListener('click', resetAll);

grid.addEventListener('click', (e) => {
  const copyBtn = e.target.closest('.copy-email-btn');
  if(copyBtn){
    const email = copyBtn.getAttribute('data-email');
    if(email) copyEmailToClipboard(email, copyBtn);
    return;
  }
  const btn = e.target.closest('.contact-btn');
  if(!btn) return;
  const email = btn.getAttribute('data-gmail');
  const phone = btn.getAttribute('data-whatsapp');
  if(email) openGmail(email);
  else if(phone) openWhatsApp(phone);
});

document.addEventListener('keydown', (e) => {
  if(e.key === '/' && document.activeElement !== searchInput){
    e.preventDefault();
    searchInput.focus();
  }
  if(e.key === 'Escape' && document.activeElement === searchInput && searchInput.value){
    searchInput.value = '';
    render();
  }
});

render();
</script>
