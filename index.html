<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>מבצע אבי בחופש</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --sky:#eaf7ff;
    --sky-2:#cfeeff;
    --sky-3:#9ed8f7;
    --blue:#1367a8;
    --blue-2:#0d4f84;
    --ink:#17324d;
    --ink-soft:#6b7f91;
    --line:#cfe1ec;
    --white:#ffffff;
    --cloud:#f8fcff;
    --accent:#ffb84d;
    --good:#2f8f67;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    color:var(--ink);
    font-family:'Heebo',sans-serif;
    min-height:100vh;
    background:
      radial-gradient(circle at 15% 10%, rgba(255,255,255,.95) 0 7%, transparent 8%),
      radial-gradient(circle at 22% 13%, rgba(255,255,255,.75) 0 5%, transparent 6%),
      linear-gradient(180deg,#dff4ff 0%,#f7fbfd 38%,#eef7fb 100%);
    position:relative;
  }
  body::before{
    content:"";
    position:fixed; inset:0;
    pointer-events:none;
    opacity:.45;
    background-image:
      radial-gradient(circle at 80% 14%, rgba(255,255,255,.9) 0 4%, transparent 4.5%),
      radial-gradient(circle at 84% 16%, rgba(255,255,255,.75) 0 3%, transparent 3.5%),
      radial-gradient(circle at 13% 70%, rgba(255,255,255,.65) 0 4%, transparent 4.5%);
  }
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
  :focus-visible{outline:2.5px solid var(--blue);outline-offset:2px;border-radius:6px;}

  header{
    color:#fff;
    padding:36px 24px 78px;
    position:relative;
    overflow:hidden;
    background:
      linear-gradient(180deg,rgba(8,79,132,.92),rgba(34,142,203,.84)),
      linear-gradient(135deg,#0d5f9f,#5fc2ef);
  }
  header::before{
    content:"✈";
    position:absolute;
    left:8%; top:16px;
    font-size:88px;
    opacity:.10;
    transform:rotate(-12deg);
  }
  header::after{
    content:"";
    position:absolute;
    left:-5%; right:-5%; bottom:-48px;
    height:100px;
    background:
      radial-gradient(ellipse at 10% 40%,#fff 0 33%,transparent 34%),
      radial-gradient(ellipse at 28% 55%,#fff 0 30%,transparent 31%),
      radial-gradient(ellipse at 46% 45%,#fff 0 36%,transparent 37%),
      radial-gradient(ellipse at 67% 57%,#fff 0 30%,transparent 31%),
      radial-gradient(ellipse at 84% 42%,#fff 0 36%,transparent 37%);
    opacity:.95;
  }
  .cloud{position:absolute;background:rgba(255,255,255,.88);border-radius:999px;filter:drop-shadow(0 8px 18px rgba(42,123,174,.08));z-index:1;}
  .cloud::before,.cloud::after{content:"";position:absolute;background:inherit;border-radius:50%;}
  .cloud::before{width:44%;height:145%;right:18%;bottom:0;}
  .cloud::after{width:34%;height:110%;left:18%;bottom:0;}
  .cloud.c1{width:150px;height:34px;right:6%;top:22px;opacity:.72;}
  .cloud.c2{width:105px;height:25px;left:19%;top:80px;opacity:.5;}
  .cloud.c3{width:180px;height:38px;left:-30px;bottom:28px;opacity:.66;}

  .masthead{
    max-width:980px;
    margin:0 auto;
    display:flex;
    align-items:center;
    gap:18px;
    position:relative;
    z-index:2;
  }
  .seal{
    flex:0 0 auto;
    width:60px;height:60px;
    border-radius:18px;
    border:1px solid rgba(255,255,255,.7);
    display:flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,.16);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 10px 30px rgba(4,51,85,.18);
    backdrop-filter:blur(8px);
  }
  .seal svg{width:26px;height:26px;transform:rotate(-18deg);}
  .masthead-text h1{
    font-family:'Rubik',sans-serif;
    font-weight:900;
    font-size:clamp(24px,4vw,34px);
    margin:0 0 4px;
    letter-spacing:-.2px;
    line-height:1.2;
  }
  .masthead-text p{margin:0;color:#eaf7ff;font-size:15.5px;line-height:1.5;font-weight:500;}
  .masthead-text .tag{
    display:inline-block;
    margin-top:10px;
    font-size:11px;
    letter-spacing:.5px;
    color:#fff;
    border:1px solid rgba(255,255,255,.45);
    background:rgba(255,255,255,.12);
    border-radius:999px;
    padding:5px 12px;
  }

  .search-zone{
    max-width:980px;
    margin:-36px auto 0;
    padding:0 24px;
    position:sticky;
    top:10px;
    z-index:30;
  }
  .search-card{
    background:rgba(255,255,255,.97);
    border:1px solid rgba(190,220,235,.9);
    border-radius:20px;
    box-shadow:0 20px 45px -24px rgba(13,79,132,.45),0 4px 14px rgba(32,103,149,.1);
    padding:16px 18px 14px;
    backdrop-filter:blur(12px);
  }
  .search-row{display:flex;align-items:center;gap:12px;border-bottom:1px dashed var(--line);padding-bottom:12px;}
  .search-row svg{flex:0 0 auto;color:var(--blue);opacity:.75;}
  #search{flex:1;border:none;outline:none;background:transparent;font-family:'Heebo',sans-serif;font-size:17px;font-weight:600;color:var(--ink);min-width:0;}
  #search::placeholder{color:#94a8b8;font-weight:500;}
  #search::-webkit-search-cancel-button{display:none;}
  .clear-btn{background:#eef7fc;border:none;cursor:pointer;color:var(--blue-2);font-size:13px;font-family:'Heebo',sans-serif;padding:7px 12px;border-radius:999px;display:none;min-height:32px;}
  .clear-btn.show{display:inline-block;}


  main{max-width:980px;margin:0 auto;padding:22px 24px 70px;position:relative;z-index:2;}
  .result-meta{font-size:12.5px;color:var(--ink-soft);margin:2px 4px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .result-meta b{color:var(--blue-2);}
  .reset-all{background:none;border:none;color:var(--blue);font-size:12.5px;font-weight:700;cursor:pointer;padding:4px 2px;text-decoration:underline;text-underline-offset:2px;}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px;}

  .group-header{
    grid-column:1/-1;
    display:flex;align-items:center;gap:9px;
    padding:16px 2px 2px;
    font-family:'Rubik',sans-serif;font-weight:800;font-size:14.5px;color:var(--blue-2);
  }
  .group-header:first-child{padding-top:2px;}
  .group-header .line{flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent);}
  .group-header .count{font-family:'Heebo',sans-serif;font-weight:700;font-size:11.5px;color:var(--ink-soft);background:#eef6fb;border-radius:999px;padding:2px 9px;}

  .card{
    background:rgba(255,255,255,.97);
    border:1px solid var(--line);
    border-radius:17px;
    position:relative;
    box-shadow:0 14px 28px -20px rgba(13,79,132,.45);
    overflow:hidden;
    animation:rise .3s ease both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  .card::before{
    content:"";
    position:absolute;
    top:0; right:0; left:0;
    height:4px;
    background:linear-gradient(90deg,var(--sky-3),var(--blue),var(--accent));
  }
  .card-head{padding:16px 16px 12px;border-bottom:1px dashed var(--line);background:linear-gradient(180deg,#fbfdff,#fff);}
  .office-label{font-size:10.5px;letter-spacing:.5px;color:var(--blue);text-transform:uppercase;display:block;margin-bottom:3px;font-weight:700;}
  .dept-title{font-family:'Rubik',sans-serif;font-weight:700;font-size:18px;color:var(--blue-2);margin:0;line-height:1.25;}
  .dept-title.generic{color:var(--ink-soft);font-weight:500;font-size:14px;font-family:'Heebo',sans-serif;}
  .card-body{padding:12px 16px 16px;display:flex;flex-direction:column;gap:11px;}
  .role-block{display:flex;gap:10px;}
  .role-icon{flex:0 0 auto;width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:#edf7fc;color:var(--blue);margin-top:1px;}
  .role-icon svg{width:15px;height:15px;}
  .role-icon.collector{background:#eaf7f1;color:var(--good);}
  .role-info{flex:1;min-width:0;}
  .role-kind{font-size:11px;color:var(--ink-soft);font-weight:700;margin-bottom:1px;}
  .role-name{font-weight:700;font-size:14.5px;color:var(--ink);margin-bottom:3px;}
  .role-contact{display:flex;flex-wrap:wrap;gap:6px;}
  .contact-btn{
    display:inline-flex;align-items:center;gap:5px;
    font-size:12px;color:var(--blue-2);background:#f5fbff;border:1px solid var(--line);
    border-radius:8px;padding:5px 8px;cursor:pointer;text-decoration:none;
    max-width:100%;min-height:30px;font-family:'Heebo',sans-serif;
  }
  .contact-btn:active{background:var(--sky-2);}
  .contact-btn svg{flex:0 0 auto;width:12px;height:12px;opacity:.7;}
  .contact-btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .role-empty{font-size:12.5px;color:#aab8c2;font-style:italic;}

  .toast{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(8px);
    background:var(--ink);color:#fff;font-size:13px;font-weight:600;padding:9px 16px;border-radius:999px;
    opacity:0;pointer-events:none;transition:all .2s ease;z-index:100;box-shadow:0 10px 24px rgba(0,0,0,.25);
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .empty-state{text-align:center;padding:60px 20px;color:var(--ink-soft);}
  .empty-state .big{font-family:'Rubik',sans-serif;font-size:20px;color:var(--blue-2);margin-bottom:6px;}
  .empty-state button{margin-top:14px;background:var(--blue);color:#fff;border:none;border-radius:999px;padding:9px 18px;font-size:13px;font-weight:700;cursor:pointer;font-family:'Heebo',sans-serif;}
  mark{background:rgba(255,184,77,.4);color:inherit;border-radius:3px;padding:0 2px;}
  footer{text-align:center;padding:18px;font-size:12px;color:var(--ink-soft);}

  @media (max-width:520px){
    header{padding:26px 16px 66px;}
    .masthead{gap:12px;}
    .seal{width:46px;height:46px;border-radius:14px;}
    .seal svg{width:21px;height:21px;}
    .masthead-text h1{font-size:clamp(21px,7vw,27px);}
    .masthead-text p{font-size:13px;line-height:1.35;}
    .search-zone{margin-top:-30px;padding:0 12px;top:8px;}
    .search-card{padding:13px 14px 12px;border-radius:17px;}
    main{padding-left:12px;padding-right:12px;}
    .grid{grid-template-columns:1fr;}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.001s !important;transition-duration:.001s !important;scroll-behavior:auto !important;}
  }
</style>
</head>
<body>

<header>
  <div class="cloud c1"></div>
  <div class="cloud c2"></div>
  <div class="cloud c3"></div>
  <div class="masthead">
    <div class="seal">
      <svg viewBox="0 0 64 64" fill="none">
        <path d="M6 46 Q22 40 30 26" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-dasharray="1 6" opacity=".7"/>

          <path fill="#fff" d="M32 10c1.7 0 3 3.4 3 7.6v9.9l14.6 8.6c.9.5 1.4 1.5 1.4 2.5v2c0 .7-.6 1.1-1.3.9L35 37.4v8.9l4.6 3.5c.5.4.8 1 .8 1.6v1.7c0 .6-.5 1-1.1.8L32 51.4l-7.3 2.5c-.6.2-1.1-.2-1.1-.8v-1.7c0-.6.3-1.2.8-1.6l4.6-3.5v-8.9l-14.7 4.1c-.7.2-1.3-.2-1.3-.9v-2c0-1 .5-2 1.4-2.5L29 27.5v-9.9c0-4.2 1.3-7.6 3-7.6Z"/>
        </g>
      </svg>
    </div>
    <div class="masthead-text">
      <h1>מבצע "אבי בחופש"</h1>
      <p>מי מגבה איפה, ואיך יוצרים איתם קשר</p>
      <span class="tag">✈ חיפוש לפי מגבה · מתאם · מחלקה · משרד</span>
    </div>
  </div>
</header>

<div class="search-zone">
  <div class="search-card">
    <div class="search-row">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <label for="search" class="sr-only">חיפוש</label>
      <input type="search" id="search" placeholder="חיפוש לפי שם, מחלקה או משרד…" autocomplete="off" enterkeyhint="search">
      <button class="clear-btn" id="clearBtn" type="button">נקה</button>
    </div>
  </div>
</div>

<main>
  <div class="result-meta" id="resultMeta" aria-live="polite"></div>
  <div class="grid" id="grid"></div>
  <div class="empty-state" id="emptyState" style="display:none;">
    <div class="big">לא נמצאו תוצאות</div>
    <div>נסו לחפש שם, מחלקה או משרד אחר</div>
    <button id="resetFromEmpty" type="button">נקה את כל הסינון</button>
  </div>
</main>

<footer>רשימת הגיבויים האישית של אבי כהן לזמן חופשה</footer>

const ICON_USER = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="7" r="4"/></svg>';
const ICON_CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
const ICON_CLIP = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M9 4H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-3"/><path d="M9 12h6M9 16h6"/></svg>';
const ICON_MAIL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/></svg>';
const ICON_PHONE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>';

// Group data by office, then keep original order within an office (which follows department order)
const grouped = [...DATA].sort((a,b) => DATA.map(r=>r.office).indexOf(a.office) - DATA.map(r=>r.office).indexOf(b.office));

const grid = document.getElementById('grid');
const searchInput = document.getElementById('search');
const clearBtn = document.getElementById('clearBtn');
const resultMeta = document.getElementById('resultMeta');
const emptyState = document.getElementById('emptyState');
const toastEl = document.getElementById('toast');

const offices = [...new Set(DATA.map(r => r.office).filter(Boolean))];
let toastTimer = null;

function esc(s){
  if(s===null || s===undefined) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function highlight(text, q){
  const t = esc(text);
  if(!q) return t;
  try{
    const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig');
    return t.replace(re, '<mark>$1</mark>');
  }catch(e){ return t; }
}

function matches(rec, q){
  if(!q) return true;
  const fields = [rec.office, rec.department, rec.coordinator_name, rec.approver_name, rec.collector_name,
                   rec.coordinator_email, rec.approver_email, rec.collector_email];
  return fields.some(f => f && String(f).toLowerCase().includes(q));
}

function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1500);
}

function copyValue(val){
  const done = () => showToast('הועתק: ' + val);
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(val).then(done).catch(() => fallbackCopy(val, done));
  }else{
    fallbackCopy(val, done);
  }
}
function fallbackCopy(val, cb){
  const ta = document.createElement('textarea');
  ta.value = val; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); cb(); }catch(e){}
  document.body.removeChild(ta);
}

function contactBtn(kind, value, icon, q){
  if(!value) return '';
  const isEmail = kind === 'email';
  const dataAttr = `data-copy="${esc(value)}"`;
  return `<button type="button" class="contact-btn" ${dataAttr} title="${isEmail?'העתק אימייל':'העתק טלפון'}">${icon}<span>${highlight(value,q)}</span></button>`;
}

function roleBlock(kind, iconSvg, name, email, phone, isCollector, q){
  if(!name && !email && !phone){
    return `<div class="role-block">
      <div class="role-icon${isCollector?' collector':''}">${iconSvg}</div>
      <div class="role-info">
        <div class="role-kind">${kind}</div>
        <div class="role-empty">אין נתון</div>
      </div>
    </div>`;
  }
  return `<div class="role-block">
    <div class="role-icon${isCollector?' collector':''}">${iconSvg}</div>
    <div class="role-info">
      <div class="role-kind">${kind}</div>
      <div class="role-name">${highlight(name || '—', q)}</div>
      <div class="role-contact">
        ${contactBtn('email', email, ICON_MAIL, q)}
        ${contactBtn('phone', phone, ICON_PHONE, q)}
      </div>
    </div>
  </div>`;
}

function cardHTML(rec, q){
  const hasDept = !!rec.department;
  return `<div class="card">
    <div class="card-head">
      <span class="office-label">${highlight(rec.office, q)}</span>
      <h3 class="dept-title${hasDept?'':' generic'}">${hasDept ? highlight(rec.department, q) : 'כללי — ללא חלוקה למחלקות'}</h3>
    </div>
    <div class="card-body">
      ${roleBlock('מתאם.ת', ICON_USER, rec.coordinator_name, rec.coordinator_email, rec.coordinator_phone, false, q)}
      ${roleBlock('מאשר.ת', ICON_CHECK, rec.approver_name, rec.approver_email, rec.approver_phone, false, q)}
      ${roleBlock('מי מגבה אותי', ICON_CLIP, rec.collector_name, rec.collector_email, null, true, q)}
    </div>
  </div>`;
}

function render(){
  const q = searchInput.value.trim().toLowerCase();
  clearBtn.classList.toggle('show', q.length > 0);

  let results = grouped.filter(r => matches(r, q));

  let html = '';
  let lastOffice = null;
  results.forEach(r => {
    if(r.office !== lastOffice){
      const cnt = results.filter(x => x.office === r.office).length;
      html += `<div class="group-header">${esc(r.office)}<span class="line"></span><span class="count">${cnt}</span></div>`;
      lastOffice = r.office;
    }
    html += cardHTML(r, q);
  });
  grid.innerHTML = html;
  emptyState.style.display = results.length === 0 ? 'block' : 'none';

  resultMeta.innerHTML = q
    ? `נמצאו <b>${results.length}</b> תוצאות מתוך ${DATA.length} <button class="reset-all" id="resetAll" type="button">נקה סינון</button>`
    : `סה"כ <b>${DATA.length}</b> רשומות · ${offices.length} משרדים`;

  const resetAllBtn = document.getElementById('resetAll');
  if(resetAllBtn) resetAllBtn.addEventListener('click', resetAll);
}

function resetAll(){
  searchInput.value = '';
  render();
}

searchInput.addEventListener('input', render);
clearBtn.addEventListener('click', () => {
  searchInput.value = '';
  searchInput.focus();
  render();
});
document.getElementById('resetFromEmpty').addEventListener('click', resetAll);

grid.addEventListener('click', (e) => {
  const btn = e.target.closest('.contact-btn');
  if(btn) copyValue(btn.getAttribute('data-copy'));
});

document.addEventListener('keydown', (e) => {
  if(e.key === '/' && document.activeElement !== searchInput){
    e.preventDefault();
    searchInput.focus();
  }
  if(e.key === 'Escape' && document.activeElement === searchInput && searchInput.value){
    searchInput.value = '';
    render();
  }
});

render();
</script>
