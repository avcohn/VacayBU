<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מי מגבה אותי בחופשה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Assistant:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#16233c;
    --navy-2:#1f3556;
    --paper:#f6f3ec;
    --paper-2:#efe9db;
    --ink:#1b2030;
    --ink-soft:#5b6272;
    --brass:#a97e3f;
    --brass-light:#c99a54;
    --line:#d8d1bd;
    --white:#fffdf8;
    --good:#4b7a5e;
  }
  *{box-sizing:border-box;}
  body{margin:0;}
  html{scroll-behavior:smooth;}
  body{
    background:
      radial-gradient(1200px 700px at 15% -10%, #1c2f4d 0%, transparent 55%),
      var(--paper);
    color:var(--ink);
    font-family:'Assistant', sans-serif;
    min-height:100vh;
  }

  /* ===== Header / masthead ===== */
  header{
    background:linear-gradient(180deg, var(--navy) 0%, var(--navy-2) 100%);
    color:var(--paper);
    padding:38px 24px 30px;
    position:relative;
    overflow:hidden;
    border-bottom:6px solid var(--brass);
  }
  header::before{
    content:"";
    position:absolute; inset:0;
    background-image:
      repeating-linear-gradient(135deg, rgba(255,255,255,.03) 0 2px, transparent 2px 26px);
    pointer-events:none;
  }
  .masthead{
    max-width:980px;
    margin:0 auto;
    display:flex;
    align-items:center;
    gap:20px;
    position:relative;
  }
  .seal{
    flex:0 0 auto;
    width:58px;height:58px;
    border-radius:50%;
    border:2px solid var(--brass-light);
    display:flex;align-items:center;justify-content:center;
    position:relative;
    background:radial-gradient(circle at 35% 30%, #24406a, #16233c 70%);
  }
  .seal::before{
    content:"";
    position:absolute; inset:6px;
    border-radius:50%;
    border:1px dashed rgba(201,154,84,.6);
  }
  .seal span{
    font-family:'Frank Ruhl Libre', serif;
    font-weight:900;
    font-size:19px;
    color:var(--brass-light);
    letter-spacing:.5px;
  }
  .masthead-text h1{
    font-family:'Frank Ruhl Libre', serif;
    font-weight:900;
    font-size:clamp(24px, 4vw, 34px);
    margin:0 0 4px;
    letter-spacing:.3px;
  }
  .masthead-text p{
    margin:0;
    color:#c7cede;
    font-size:14.5px;
    letter-spacing:.2px;
  }
  .masthead-text .tag{
    display:inline-block;
    margin-top:10px;
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    letter-spacing:1.2px;
    color:var(--brass-light);
    border:1px solid rgba(201,154,84,.45);
    border-radius:20px;
    padding:4px 12px;
  }

  /* ===== Search zone ===== */
  .search-zone{
    max-width:980px;
    margin:-24px auto 0;
    padding:0 24px;
    position:relative;
    z-index:5;
  }
  .search-card{
    background:var(--white);
    border:1px solid var(--line);
    border-radius:14px;
    box-shadow:0 16px 34px -18px rgba(22,35,60,.35), 0 2px 6px rgba(22,35,60,.06);
    padding:18px 20px 16px;
  }
  .search-row{
    display:flex;
    align-items:center;
    gap:12px;
    border-bottom:1px solid var(--line);
    padding-bottom:14px;
  }
  .search-row svg{flex:0 0 auto; opacity:.55;}
  #search{
    flex:1;
    border:none;
    outline:none;
    background:transparent;
    font-family:'Assistant', sans-serif;
    font-size:18px;
    font-weight:600;
    color:var(--ink);
  }
  #search::placeholder{color:#9aa0ae; font-weight:500;}
  .clear-btn{
    background:none;border:none;cursor:pointer;
    color:var(--ink-soft);
    font-size:13px;
    font-family:'Assistant',sans-serif;
    padding:4px 8px;
    display:none;
  }
  .clear-btn.show{display:inline-block;}

  .filter-row{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:12px;
  }
  .filter-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--ink-soft);
    align-self:center;
    margin-left:4px;
  }
  .chip{
    border:1px solid var(--line);
    background:var(--paper);
    color:var(--ink);
    font-family:'Assistant', sans-serif;
    font-size:13.5px;
    font-weight:600;
    padding:6px 14px;
    border-radius:20px;
    cursor:pointer;
    transition:all .15s ease;
  }
  .chip:hover{border-color:var(--brass);}
  .chip.active{
    background:var(--navy);
    border-color:var(--navy);
    color:var(--white);
  }

  /* ===== Results ===== */
  main{
    max-width:980px;
    margin:0 auto;
    padding:26px 24px 70px;
  }
  .result-meta{
    font-family:'IBM Plex Mono', monospace;
    font-size:12.5px;
    color:var(--ink-soft);
    margin:2px 4px 16px;
  }
  .result-meta b{color:var(--navy);}

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(300px, 1fr));
    gap:16px;
  }

  /* index card */
  .card{
    background:var(--white);
    border:1px solid var(--line);
    border-radius:4px 4px 10px 10px;
    position:relative;
    box-shadow:0 10px 22px -16px rgba(22,35,60,.4);
    overflow:hidden;
    animation:rise .35s ease both;
  }
  @keyframes rise{
    from{opacity:0; transform:translateY(8px);}
    to{opacity:1; transform:translateY(0);}
  }
  .card::before{
    /* top tab of index card */
    content:"";
    position:absolute;
    top:0; right:20px;
    width:64px; height:9px;
    background:var(--brass);
    border-radius:0 0 4px 4px;
  }
  .card-head{
    padding:22px 18px 14px;
    border-bottom:1px dashed var(--line);
  }
  .office-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:.6px;
    color:var(--brass);
    text-transform:uppercase;
    display:block;
    margin-bottom:4px;
  }
  .dept-title{
    font-family:'Frank Ruhl Libre', serif;
    font-weight:700;
    font-size:20px;
    color:var(--navy);
    margin:0;
    line-height:1.25;
  }
  .card-body{
    padding:14px 18px 18px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .role-block{
    display:flex;
    gap:10px;
  }
  .role-icon{
    flex:0 0 auto;
    width:30px; height:30px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:var(--paper-2);
    color:var(--navy);
    font-size:14px;
    margin-top:1px;
  }
  .role-icon.collector{background:#e7f0e9; color:var(--good);}
  .role-info{flex:1; min-width:0;}
  .role-kind{
    font-size:11.5px;
    color:var(--ink-soft);
    font-weight:700;
    margin-bottom:1px;
  }
  .role-name{
    font-weight:700;
    font-size:15px;
    color:var(--ink);
    margin-bottom:2px;
  }
  .role-contact{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--ink-soft);
    display:flex;
    flex-direction:column;
    gap:1px;
    word-break:break-all;
  }
  .role-contact a{color:var(--navy); text-decoration:none;}
  .role-contact a:hover{text-decoration:underline;}
  .role-empty{
    font-size:12.5px;
    color:#b3b0a5;
    font-style:italic;
  }

  .empty-state{
    text-align:center;
    padding:70px 20px;
    color:var(--ink-soft);
  }
  .empty-state .big{
    font-family:'Frank Ruhl Libre', serif;
    font-size:22px;
    color:var(--navy);
    margin-bottom:8px;
  }

  mark{
    background:rgba(201,154,84,.35);
    color:inherit;
    border-radius:2px;
    padding:0 1px;
  }

  footer{
    text-align:center;
    padding:20px;
    font-size:12px;
    color:var(--ink-soft);
    font-family:'IBM Plex Mono', monospace;
  }

  @media (max-width:520px){
    .masthead{gap:14px;}
    .seal{width:46px;height:46px;}
    .seal span{font-size:15px;}
    .search-zone{margin-top:-18px;}
  }
</style>
</head>
<body>

<header>
  <div class="masthead">
    <div class="seal"><span>אב</span></div>
    <div class="masthead-text">
      <h1>מי מגבה אותי בחופשה</h1>
      <p>אבי כהן · לכל משרד ומחלקה — מי מכסה עבורי כשאני בחופשה</p>
      <span class="tag">חיפוש לפי מגבה · מתאם · מחלקה · משרד</span>
    </div>
  </div>
</header>

<div class="search-zone">
  <div class="search-card">
    <div class="search-row">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="search" placeholder="חיפוש לפי מי מגבה אותי, שם מתאם, מחלקה או משרד…" autocomplete="off">
      <button class="clear-btn" id="clearBtn">נקה</button>
    </div>
    <div class="filter-row" id="officeFilters">
      <span class="filter-label">משרד:</span>
      <!-- office chips injected by JS -->
    </div>
  </div>
</div>

<main>
  <div class="result-meta" id="resultMeta"></div>
  <div class="grid" id="grid"></div>
  <div class="empty-state" id="emptyState" style="display:none;">
    <div class="big">לא נמצאו תוצאות</div>
    <div>נסו לחפש שם, מחלקה או משרד אחר</div>
  </div>
</main>

<footer>רשימת הגיבויים האישית של אבי כהן לזמן חופשה</footer>

;

const grid = document.getElementById('grid');
const searchInput = document.getElementById('search');
const clearBtn = document.getElementById('clearBtn');
const resultMeta = document.getElementById('resultMeta');
const emptyState = document.getElementById('emptyState');
const officeFiltersEl = document.getElementById('officeFilters');

let activeOffice = null;

// Build office chips
const offices = [...new Set(DATA.map(r => r.office).filter(Boolean))];
offices.forEach(off => {
  const btn = document.createElement('button');
  btn.className = 'chip';
  btn.textContent = off;
  btn.addEventListener('click', () => {
    activeOffice = (activeOffice === off) ? null : off;
    render();
  });
  officeFiltersEl.appendChild(btn);
});

function updateChips(){
  [...officeFiltersEl.querySelectorAll('.chip')].forEach(chip => {
    chip.classList.toggle('active', chip.textContent === activeOffice);
  });
}

function esc(s){
  if(s===null || s===undefined) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function highlight(text, q){
  const t = esc(text);
  if(!q) return t;
  try{
    const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig');
    return t.replace(re, '<mark>$1</mark>');
  }catch(e){ return t; }
}

function matches(rec, q){
  if(!q) return true;
  const fields = [rec.office, rec.department, rec.coordinator_name, rec.approver_name, rec.collector_name,
                   rec.coordinator_email, rec.approver_email, rec.collector_email];
  return fields.some(f => f && String(f).toLowerCase().includes(q));
}

function roleBlock(kind, iconSvg, name, email, phone, isCollector){
  if(!name && !email && !phone){
    return `<div class="role-block">
      <div class="role-icon${isCollector?' collector':''}">${iconSvg}</div>
      <div class="role-info">
        <div class="role-kind">${kind}</div>
        <div class="role-empty">אין נתון</div>
      </div>
    </div>`;
  }
  const q = searchInput.value.trim().toLowerCase();
  let contact = '';
  if(email) contact += `<a href="mailto:${esc(email)}">${highlight(email,q)}</a>`;
  if(phone) contact += `<span>${highlight(phone,q)}</span>`;
  return `<div class="role-block">
    <div class="role-icon${isCollector?' collector':''}">${iconSvg}</div>
    <div class="role-info">
      <div class="role-kind">${kind}</div>
      <div class="role-name">${highlight(name || '—', q)}</div>
      <div class="role-contact">${contact}</div>
    </div>
  </div>`;
}

const ICON_COORD = '👤';
const ICON_APPR = '✔';
const ICON_COLLECT = '📋';

function cardHTML(rec, q){
  const deptLine = rec.department ? rec.department : rec.office;
  return `<div class="card">
    <div class="card-head">
      <span class="office-label">${highlight(rec.office, q)}</span>
      <h3 class="dept-title">${highlight(deptLine, q)}</h3>
    </div>
    <div class="card-body">
      ${roleBlock('מתאם.ת', ICON_COORD, rec.coordinator_name, rec.coordinator_email, rec.coordinator_phone, false)}
      ${roleBlock('מאשר.ת', ICON_APPR, rec.approver_name, rec.approver_email, rec.approver_phone, false)}
      ${roleBlock('מי מגבה אותי', ICON_COLLECT, rec.collector_name, rec.collector_email, null, true)}
    </div>
  </div>`;
}

function render(){
  updateChips();
  const q = searchInput.value.trim().toLowerCase();
  clearBtn.classList.toggle('show', q.length > 0);

  let results = DATA.filter(r => matches(r, q));
  if(activeOffice){
    results = results.filter(r => r.office === activeOffice);
  }

  grid.innerHTML = results.map(r => cardHTML(r, q)).join('');
  emptyState.style.display = results.length === 0 ? 'block' : 'none';

  if(q || activeOffice){
    resultMeta.innerHTML = `נמצאו <b>${results.length}</b> תוצאות מתוך ${DATA.length}`;
  }else{
    resultMeta.innerHTML = `סה"כ <b>${DATA.length}</b> רשומות · ${offices.length} משרדים`;
  }
}

searchInput.addEventListener('input', render);
clearBtn.addEventListener('click', () => {
  searchInput.value = '';
  searchInput.focus();
  render();
});

render();
</script>
